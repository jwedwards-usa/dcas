name: Deploy DCA Page

on:
  push:
    branches: [main]
    paths:
      - latest-dcas.json
      - docs/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare site
        run: |
          mkdir -p docs
          cp latest-dcas.json docs/latest-dcas.json

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: docs

      # Artifact metadata may take a moment to become visible after upload.
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..12}; do
            if visible_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts | map(select(.expired == false)) | if length == 1 then .[0].id else empty end') \
              && [[ "$visible_id" == "$ARTIFACT_ID" ]]; then
              echo "Pages artifact $ARTIFACT_ID is visible."
              # Allow the Pages action's artifact service to catch up as well.
              sleep 5
              exit 0
            fi
            echo "Waiting for Pages artifact ($attempt/12)..."
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become visible."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
